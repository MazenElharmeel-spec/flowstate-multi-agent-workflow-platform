version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: awp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agent_workflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: awp-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  crm-mcp:
    build:
      context: .
      dockerfile: backend/mcp_servers/crm/Dockerfile
    container_name: awp-crm-mcp
    restart: unless-stopped
    environment:
      PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  ticketing-mcp:
    build:
      context: .
      dockerfile: backend/mcp_servers/ticketing/Dockerfile
    container_name: awp-ticketing-mcp
    restart: unless-stopped
    environment:
      PORT: 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  email-mcp:
    build:
      context: .
      dockerfile: backend/mcp_servers/email/Dockerfile
    container_name: awp-email-mcp
    restart: unless-stopped
    environment:
      PORT: 8003
      EMAIL_DB_PATH: /data/email.sqlite
    volumes:
      - email_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  payments-mcp:
    build:
      context: .
      dockerfile: backend/mcp_servers/payments/Dockerfile
    container_name: awp-payments-mcp
    restart: unless-stopped
    environment:
      PORT: 8004
      PAYMENTS_DB_PATH: /data/payments.sqlite
    volumes:
      - payments_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: awp-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel-collector-config.yml:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: awp-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: awp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3031:3000"
    depends_on:
      - prometheus

  api-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/agent_workflow
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@postgres:5432/agent_workflow
      ENVIRONMENT: production
    command: ["sh", "-c", "alembic upgrade head && python -m backend.app.db.seed"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crm-mcp:
        condition: service_healthy
      ticketing-mcp:
        condition: service_healthy
      email-mcp:
        condition: service_healthy
      payments-mcp:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/agent_workflow
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@postgres:5432/agent_workflow
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      CRM_MCP_URL: http://crm-mcp:8001/mcp
      TICKETING_MCP_URL: http://ticketing-mcp:8002/mcp
      EMAIL_MCP_URL: http://email-mcp:8003/mcp
      PAYMENTS_MCP_URL: http://payments-mcp:8004/mcp
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SECRET_KEY: super-secret-production-key-change-me-at-least-32-chars
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./monitoring/nginx/api-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8100:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/agent_workflow
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@postgres:5432/agent_workflow
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      WORKER_MAX_CONCURRENCY: 5
      CRM_MCP_URL: http://crm-mcp:8001/mcp
      TICKETING_MCP_URL: http://ticketing-mcp:8002/mcp
      EMAIL_MCP_URL: http://email-mcp:8003/mcp
      PAYMENTS_MCP_URL: http://payments-mcp:8004/mcp
      ENVIRONMENT: production
      SECRET_KEY: super-secret-production-key-change-me-at-least-32-chars
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      WORKER_METRICS_PORT: 8005
    command: ["python", "-m", "backend.app.orchestration.worker"]
    expose:
      - "8005"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awp-web
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  email_data:
  payments_data:
  prometheus_data:
  grafana_data:
