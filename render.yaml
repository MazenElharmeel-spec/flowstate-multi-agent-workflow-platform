services:
  - type: web
    name: flowstate-demo
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.demo
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_USER
        value: "false"
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: flowstate-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowstate-demo-redis
          property: connectionString
      - key: REDIS_REQUIRED
        value: "true"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: WORKER_MAX_CONCURRENCY
        value: "1"
      - key: CRM_MCP_URL
        value: http://127.0.0.1:8001/mcp
      - key: TICKETING_MCP_URL
        value: http://127.0.0.1:8002/mcp
      - key: EMAIL_MCP_URL
        value: http://127.0.0.1:8003/mcp
      - key: PAYMENTS_MCP_URL
        value: http://127.0.0.1:8004/mcp
      - key: DEFAULT_LLM_PROVIDER
        value: fake
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: flowstate-demo-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: flowstate-demo-db
    databaseName: flowstate_demo
    user: flowstate_demo
    plan: free
