global:
  scrape_interval: 15s
scrape_configs:
  - job_name: workflow-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: workflow-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8005
        refresh_interval: 15s
